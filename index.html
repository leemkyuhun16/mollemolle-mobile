<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>몰래몰래 - 로얄 카지노 에디션 (모바일)</title>
<style>
  html,body{margin:0;height:100%;background:#12100d;color:#eee;font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
  body{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;padding:4px 0 8px;box-sizing:border-box;overflow:hidden;height:100dvh}
  #gameWrap{position:relative;width:100%;max-width:960px;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  canvas{background:#1c1a17;border-radius:8px;max-width:100%;max-height:100%;box-shadow:0 8px 30px #000a;border:1px solid #3c3224;display:block;touch-action:none}
  #hud{display:flex;gap:8px;font-size:12px;align-items:center;flex-wrap:wrap;justify-content:center;background:#1d1915;padding:5px 12px;border-radius:99px;border:1px solid #3a3022;box-shadow:0 4px 16px #0006;max-width:98vw;z-index:5}
  .bar{width:70px;height:8px;background:#2f2a24;border-radius:5px;overflow:hidden;display:inline-block;vertical-align:middle}
  .bar i{display:block;height:100%;transition:width .15s}
  #help{font-size:11px;opacity:.75;text-align:center;line-height:1.5;padding:0 8px;display:none}
  kbd{background:#3a352b;padding:1px 5px;border-radius:4px;border:1px solid #574e3f;font-size:10.5px}
  .done{color:#8fd694;text-decoration:line-through}

  #casinoControls{display:none;width:min(960px,98vw);max-height:34vh;overflow:auto;box-sizing:border-box;border:1px solid #9e7d4b;border-radius:12px;background:linear-gradient(145deg,#231a21,#10171f 70%,#251921);box-shadow:0 10px 30px #000b;padding:8px 12px;color:#f2e4c7;z-index:20}
  #casinoControls .cc-head{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid #8c714744}
  #casinoControls .cc-title{font-weight:800;letter-spacing:.04em;color:#f0cf86;font-size:12.5px}
  #casinoControls .cc-bal{font-variant-numeric:tabular-nums;font-weight:800;color:#fff2d3;font-size:12.5px}
  #casinoControls .cc-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:5px 0}
  #casinoControls .cc-label{font-size:11px;color:#d6c39b;min-width:52px;font-weight:700}
  #casinoControls button{appearance:none;border:1px solid #8f7855;background:linear-gradient(#554236,#2f2528);color:#f8ead0;border-radius:7px;padding:7px 10px;font:600 12px 'Pretendard','Noto Sans KR',sans-serif;cursor:pointer;box-shadow:inset 0 1px #ffffff1c;transition:filter .12s,transform .12s,border-color .12s;-webkit-tap-highlight-color:transparent}
  #casinoControls button:hover,#casinoControls button:active{filter:brightness(1.22)}
  #casinoControls button.selected{background:linear-gradient(#e0be72,#a1753b);border-color:#fae3aa;color:#1d160f;font-weight:800;box-shadow:0 0 10px #e0be7255}
  #casinoControls button.primary{background:linear-gradient(#d8b060,#94672d);border-color:#f5d794;color:#1c140c;font-weight:900;padding:10px 16px;font-size:13px}
  #casinoControls button.danger{background:linear-gradient(#743139,#3a1e26);border-color:#b2686d}
  #casinoControls button.sub{background:linear-gradient(#354556,#1e2833);border-color:#68849e;padding:6px 8px;font-size:11px}
  #casinoControls button:disabled{opacity:.38;cursor:not-allowed;filter:grayscale(.6)}
  #casinoControls .cc-foot{font-size:11px;color:#cbbd9f;margin-top:5px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  #casinoControls .cc-status{font-size:11.5px;color:#f7dc9f;font-weight:700;margin-left:auto}
  #casinoControls .cc-grid{display:flex;gap:4px;flex-wrap:wrap}
  #casinoControls .cc-grid button{min-width:28px;padding:5px 6px;font-size:11px}
  #casinoControls .cc-hint{color:#b0a28a;font-size:10px}
  #casinoControls .road-dot{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:800;color:#fff;margin-right:3px}

  /* ===== 모바일 터치 컨트롤 ===== */
  #touchUI{display:none;position:fixed;inset:0;pointer-events:none;z-index:30}
  #touchUI.show{display:block}
  .joy-zone{position:absolute;left:0;bottom:0;width:48%;height:42%;pointer-events:auto}
  .joy-base{position:absolute;width:110px;height:110px;border-radius:50%;background:rgba(30,26,22,.55);border:2px solid rgba(200,170,100,.45);box-shadow:0 0 20px #0008, inset 0 0 12px #0006;left:22px;bottom:28px;display:flex;align-items:center;justify-content:center}
  .joy-knob{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f0d090,#a07840);border:2px solid #e8c878;box-shadow:0 4px 12px #0009;position:absolute;transform:translate(-50%,-50%);left:50%;top:50%;touch-action:none}
  .btn-zone{position:absolute;right:0;bottom:0;width:52%;height:48%;pointer-events:none;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:flex-end;gap:10px;padding:16px 14px 22px;box-sizing:border-box}
  .tbtn{pointer-events:auto;width:62px;height:62px;border-radius:50%;border:2px solid rgba(220,190,120,.55);background:rgba(40,32,28,.72);color:#f5e6c8;font:700 12px 'Pretendard','Noto Sans KR',sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;box-shadow:0 4px 14px #0009, inset 0 1px #fff2;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:none}
  .tbtn:active,.tbtn.active{background:rgba(180,140,60,.85);border-color:#f0d080;transform:scale(.94)}
  .tbtn.primary{width:72px;height:72px;background:linear-gradient(145deg,#c9a050,#8a6028);border-color:#f5d794;color:#1a1208;font-size:13px}
  .tbtn.sneak{background:rgba(50,70,90,.75);border-color:rgba(120,160,200,.5)}
  .tbtn.run{background:rgba(90,40,40,.75);border-color:rgba(200,100,100,.5)}
  .tbtn.small{width:48px;height:48px;font-size:11px}
  .tbtn-label{font-size:10px;opacity:.85;margin-top:1px}
  #mobileHint{display:none;position:fixed;top:8px;left:50%;transform:translateX(-50%);background:rgba(20,16,12,.88);border:1px solid #8a7040;color:#f0dca0;font-size:11px;padding:5px 12px;border-radius:20px;z-index:40;pointer-events:none;white-space:nowrap}
  @media(max-width:900px){
    body{padding:2px 0 4px;gap:2px}
    #help{display:none}
    #hud{font-size:11px;gap:6px;padding:4px 10px}
    .bar{width:55px;height:7px}
    #casinoControls{max-height:38vh;padding:6px 10px}
    #casinoControls button{padding:8px 10px;font-size:12px;min-height:36px}
  }
  @media(orientation:landscape) and (max-height:500px){
    .joy-base{width:90px;height:90px;left:14px;bottom:12px}
    .joy-knob{width:40px;height:40px}
    .tbtn{width:52px;height:52px;font-size:11px}
    .tbtn.primary{width:60px;height:60px}
    .btn-zone{height:55%;padding:8px 10px 12px}
  }
</style>
</head>
<body>
<div id="hud"></div>
<div id="gameWrap">
  <canvas id="c" width="960" height="640"></canvas>
</div>
<div id="casinoControls" aria-live="polite"></div>
<div id="help">
  이동 <kbd>WASD</kbd>/방향키 · 달리기 <kbd>Shift</kbd>(소리 큼) · 살금살금 <kbd>C</kbd>(소리 작음) ·
  상호작용 <kbd>E</kbd>(열쇠/현금/소주) · 소변 <kbd>Space</kbd> 꾹 · 재시작 <kbd>R</kbd>
</div>

<!-- 모바일 터치 UI -->
<div id="touchUI">
  <div class="joy-zone" id="joyZone">
    <div class="joy-base" id="joyBase">
      <div class="joy-knob" id="joyKnob"></div>
    </div>
  </div>
  <div class="btn-zone" id="btnZone">
    <button class="tbtn sneak" id="btnSneak" type="button">살금<br><span class="tbtn-label">C</span></button>
    <button class="tbtn run" id="btnRun" type="button">달리기<br><span class="tbtn-label">Shift</span></button>
    <button class="tbtn" id="btnInteract" type="button">상호작용<br><span class="tbtn-label">E</span></button>
    <button class="tbtn primary" id="btnPee" type="button">소변<br><span class="tbtn-label">Space</span></button>
    <button class="tbtn small" id="btnRestart" type="button">재시작<br><span class="tbtn-label">R</span></button>
  </div>
</div>
<div id="mobileHint">터치로 조작 · 왼쪽 조이스틱 / 오른쪽 버튼</div>

<script>
/* truncated - full content too large for this call, using alternative */
</script>
</body>
</html>
